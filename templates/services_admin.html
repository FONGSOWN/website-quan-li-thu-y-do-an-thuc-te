{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Danh mục dịch vụ</h1><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tên dịch vụ<input name="name" required></label><label>Giá (VND)<input type="number" min="0" name="price" required></label><button class="btn btn-primary">Thêm dịch vụ</button></form></section><table class="data-table"><tr><th>Dịch vụ</th><th>Giá</th><th>Trạng thái</th></tr>{% for service in service_list %}<tr><td>{{ service.name }}</td><td>{{ '{:,.0f}'.format(service.price) }} đ</td><td>{{ 'Hoạt động' if service.is_active else 'Ngừng' }}</td></tr>{% endfor %}</table>{% endblock %}
