{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>{{ 'Sửa' if pet else 'Thêm' }} hồ sơ thú cưng</h1><form method="post" enctype="multipart/form-data" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tên thú cưng<input name="name" value="{{ pet.name if pet else '' }}" required></label><label>Loài<input name="species" value="{{ pet.species if pet else '' }}" placeholder="Chó, Mèo..." required></label><label>Giống<input name="breed" value="{{ pet.breed if pet else '' }}"></label><label>Ngày sinh<input type="date" name="birth_date" value="{{ pet.birth_date if pet and pet.birth_date else '' }}"></label><label>Giới tính<input name="gender" value="{{ pet.gender if pet else '' }}"></label><label>Cân nặng (kg)<input type="number" step="0.1" min="0" name="weight" value="{{ pet.weight if pet and pet.weight else '' }}"></label><label>Tiền sử bệnh<textarea name="medical_history">{{ pet.medical_history if pet else '' }}</textarea></label><label>Dị ứng<textarea name="allergies">{{ pet.allergies if pet else '' }}</textarea></label><label>Ảnh đại diện<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label><button class="btn btn-primary">Lưu hồ sơ</button></form></section>{% endblock %}
