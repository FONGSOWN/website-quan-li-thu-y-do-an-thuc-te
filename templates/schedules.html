{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Quản lý lịch trực bác sĩ</h1><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Bác sĩ<select name="doctor_id" required>{% for doctor in doctors %}<option value="{{ doctor.id }}">{{ doctor.full_name }}</option>{% else %}<option value="">Chưa có bác sĩ</option>{% endfor %}</select></label><label>Ngày trực<input type="date" name="schedule_date" required></label><label>Ca trực<select name="shift"><option>Sáng</option><option>Chiều</option><option selected>Cả ngày</option></select></label><button class="btn btn-primary">Lưu lịch trực</button></form></section><table class="data-table"><tr><th>Bác sĩ</th><th>Ngày</th><th>Ca</th></tr>{% for schedule in schedules %}<tr><td>{{ schedule.full_name }}</td><td>{{ schedule.schedule_date }}</td><td>{{ schedule.shift }}</td></tr>{% else %}<tr><td colspan="3">Chưa có lịch trực.</td></tr>{% endfor %}</table>{% endblock %}
