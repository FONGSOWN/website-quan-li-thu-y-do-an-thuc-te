{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Hồ sơ cá nhân</h1><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Họ tên<input name="full_name" value="{{ current_user.full_name }}" required></label>{% if customer %}<label>Số điện thoại<input name="phone" value="{{ customer.phone }}" required></label><label>Địa chỉ<input name="address" value="{{ customer.address }}"></label>{% endif %}<label>Mật khẩu mới (bỏ trống nếu không đổi)<input type="password" name="new_password" minlength="8"></label><button class="btn btn-primary">Lưu thay đổi</button></form></section>{% endblock %}
