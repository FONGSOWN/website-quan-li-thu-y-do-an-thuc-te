{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Lập hóa đơn #{{ appointment.id }}</h1><p>{{ appointment.pet_name }} · {{ appointment.service }}</p><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tiền khám/dịch vụ<input readonly value="{{ '{:,.0f}'.format(base_fee) }} đ"></label><label>Tiền thuốc<input id="medicineFee" type="number" min="0" name="medicine_fee" value="0"></label><div id="items"><label>Tên khoản phát sinh<input name="item_name"></label><label>Số tiền<input type="number" min="0" name="item_amount" value="0"></label></div><button type="button" class="btn btn-secondary" onclick="document.querySelector('#items').insertAdjacentHTML('beforeend','<label>Tên khoản phát sinh<input name=\'item_name\'></label><label>Số tiền<input type=\'number\' min=\'0\' name=\'item_amount\' value=\'0\'></label>')">+ Thêm khoản</button><label>Phương thức<select name="payment_method"><option>Tiền mặt</option><option>Chuyển khoản</option></select></label><button class="btn btn-primary">Thanh toán và tạo hóa đơn</button></form></section>{% endblock %}
