{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Phiếu khám: {{ appointment.pet_name }}</h1><p>{{ appointment.full_name }} · {{ appointment.appointment_date }} {{ appointment.time_slot }}</p><form method="post" enctype="multipart/form-data" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Cân nặng (kg)<input type="number" step="0.1" name="weight" value="{{ record.weight if record else '' }}"></label><label>Nhiệt độ (°C)<input type="number" step="0.1" name="temperature" value="{{ record.temperature if record else '' }}"></label><label>Nhịp tim<input type="number" name="heart_rate" value="{{ record.heart_rate if record else '' }}"></label><label>Triệu chứng<textarea name="symptoms">{{ record.symptoms if record else '' }}</textarea></label><label>Chẩn đoán<textarea name="diagnosis">{{ record.diagnosis if record else '' }}</textarea></label><label>Toa thuốc / hướng dẫn<textarea name="prescription">{{ record.prescription if record else '' }}</textarea></label><label>Ngày tái khám<input type="date" name="follow_up_date" value="{{ record.follow_up_date if record and record.follow_up_date else '' }}"></label><label>Ảnh chẩn đoán<input type="file" name="attachment" accept=".png,.jpg,.jpeg,.webp"></label><button class="btn btn-primary">Hoàn tất và lưu bệnh án</button></form></section>{% endblock %}
