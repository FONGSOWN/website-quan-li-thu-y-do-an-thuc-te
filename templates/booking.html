{% extends 'site.html' %}
{% block title %}Đặt lịch | PetCare{% endblock %}
{% block content %}<section class="section"><div class="container"><div class="login-card wide-card"><h1>Đặt lịch khám</h1>{% include 'flashes.html' %}<form id="bookingForm" method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if current_user and current_user.role == 'CUSTOMER' %}<label>Thú cưng<select name="pet_id" required>{% for pet in pets %}<option value="{{ pet.id }}">{{ pet.name }} ({{ pet.species }})</option>{% else %}<option value="">Chưa có thú cưng</option>{% endfor %}</select></label>{% else %}<label>Họ tên chủ nuôi<input name="full_name" required></label><label>Số điện thoại<input name="phone" required></label><label>Tên thú cưng<input name="pet_name" required></label>{% endif %}<label>Dịch vụ<select name="service_id" required>{% for service in service_list %}<option value="{{ service.id }}" {% if request.args.get('service') == service.name %}selected{% endif %}>{{ service.name }} — {{ '{:,.0f}'.format(service.price) }}đ</option>{% endfor %}</select></label><label>Bác sĩ<select id="doctorId" name="doctor_id"><option value="">Chưa chọn bác sĩ</option>{% for doctor in doctors %}<option value="{{ doctor.id }}">{{ doctor.full_name }}</option>{% endfor %}</select></label><label>Ngày khám<input id="appointmentDate" type="date" name="appointment_date" required></label><label>Khung giờ<select id="slotSelect" name="time_slot"><option value="">Chọn bác sĩ và ngày trước</option></select></label><label>Ghi chú<textarea name="note"></textarea></label><button class="btn btn-primary">Gửi yêu cầu đặt lịch</button></form></div></div></section><script>const doctor=document.querySelector('#doctorId'),day=document.querySelector('#appointmentDate'),slot=document.querySelector('#slotSelect');async function loadSlots(){if(!doctor.value||!day.value)return;const response=await fetch(`/api/slots?doctor_id=${doctor.value}&date=${day.value}`);const data=await response.json();slot.innerHTML=data.slots.map(value=>`<option value="${value}">${value}</option>`).join('')||'<option value="">Không còn giờ trống</option>'}doctor?.addEventListener('change',loadSlots);day?.addEventListener('change',loadSlots);</script>{% endblock %}
