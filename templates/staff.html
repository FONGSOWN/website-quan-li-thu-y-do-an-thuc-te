{% extends 'portal.html' %}{% block portal_content %}<section class="login-card wide-card"><h1>Quản lý nhân sự</h1><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Họ tên<input name="full_name" required></label><label>Tên đăng nhập<input name="username" required></label><label>Mật khẩu tạm (ít nhất 8 ký tự)<input type="password" name="password" minlength="8" required></label><label>Vai trò<select name="role"><option value="DOCTOR">Bác sĩ</option><option value="CASHIER">Thu ngân</option></select></label><button class="btn btn-primary">Thêm nhân sự</button></form></section><table class="data-table"><tr><th>Họ tên</th><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th></tr>{% for person in staff %}<tr><td>{{ person.full_name }}</td><td>{{ person.username }}</td><td>{{ person.role }}</td><td>{{ 'Hoạt động' if person.is_active else 'Khóa' }}</td></tr>{% endfor %}</table>{% endblock %}
